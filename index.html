<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>miawmiaw studio — portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F4F1;--ink:#0B0B0C;--muted:#9C9B96;--hair:#E2E1DC;--accent:#2E4A63;--stage:#ECEBE7;
  --ease:cubic-bezier(.5,.05,.1,1);--ease-out:cubic-bezier(.16,1,.3,1);--head-h:58px;--sub-h:46px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:var(--accent);color:var(--paper)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.mono{font-family:"Space Mono",monospace}

.head{position:fixed;inset:0 0 auto 0;height:var(--head-h);z-index:60;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--hair);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px)}
.brand{font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand b{color:var(--accent)}
.nav{display:flex;align-items:center;gap:24px;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.nav .cta{border:1px solid var(--ink);color:var(--ink);padding:7px 14px;border-radius:100px;transition:.25s var(--ease)}
.nav .cta:hover{background:var(--ink);color:var(--paper)}
.search{border:none;border-bottom:1px solid var(--hair);background:transparent;font-family:"Space Grotesk",sans-serif;font-size:12.5px;padding:6px 4px;width:150px;color:var(--ink);transition:border-color .25s var(--ease)}
.search::placeholder{color:var(--muted)}
.search:focus{outline:none;border-color:var(--ink)}
.nav button{color:var(--muted);transition:color .3s var(--ease);position:relative}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--ink)}
.nav button.on::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:var(--accent)}

.sub{position:fixed;top:var(--head-h);left:0;right:0;height:var(--sub-h);z-index:55;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--hair);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.views{display:flex;gap:2px}
.views button{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 12px;border:1px solid transparent;transition:.3s var(--ease)}
.views button.on{color:var(--ink);border-color:var(--hair)}
.subright{display:flex;align-items:center;gap:16px}
.rescount{font-size:11px;color:var(--muted);letter-spacing:.04em}
.filterbtn{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);border:1px solid var(--hair);padding:7px 14px;transition:.25s var(--ease)}
.filterbtn:hover{border-color:var(--ink)}
.fbadge{font-family:"Space Mono",monospace;font-size:9px;background:var(--accent);color:#fff;border-radius:100px;padding:1px 6px;letter-spacing:0}

.page{position:fixed;inset:calc(var(--head-h) + var(--sub-h)) 0 0 0;opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
.page.show{opacity:1;pointer-events:auto}
#page-about,#page-detail{inset:var(--head-h) 0 0 0}

/* INDEX */
.index-wrap{position:absolute;inset:0;display:flex}
.list-col{position:relative;width:52%;height:100%;overflow:hidden;border-right:1px solid var(--hair)}
.scroller{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.list-set{padding:20px 0}
.row{display:grid;grid-template-columns:64px 1fr auto;align-items:baseline;gap:16px;padding:22px 34px;border-bottom:1px solid var(--hair);cursor:pointer;transition:background .4s var(--ease),padding .5s var(--ease-out)}
.row:hover{background:#EFEEEA}
.row.active{padding-left:44px}
.row .idx{font-family:"Space Mono",monospace;font-size:12px;color:var(--muted);transition:color .3s var(--ease)}
.row.active .idx{color:var(--accent)}
.row .name{font-size:clamp(22px,3vw,38px);font-weight:500;letter-spacing:-.02em;line-height:1;color:var(--muted);transition:color .4s var(--ease),transform .5s var(--ease-out)}
.row.active .name{color:var(--ink)}
.row .meta{text-align:right;line-height:1.5}
.row .cat{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block}
.row .yr{font-family:"Space Mono",monospace;font-size:11px;color:var(--muted)}
.row.active .cat{color:var(--ink)}
.row .desc{grid-column:2/4;font-size:12.5px;color:var(--muted);max-width:44ch;line-height:1.5;max-height:0;opacity:0;overflow:hidden;transition:max-height .5s var(--ease-out),opacity .4s var(--ease),margin .5s var(--ease-out)}
.row.active .desc{max-height:60px;opacity:1;margin-top:12px}

.stage-col{position:relative;flex:1;height:100%;overflow:hidden;background:var(--stage)}
.stage-img{position:absolute;inset:0;opacity:0;transition:opacity .7s var(--ease)}
.stage-img.on{opacity:1}
.stage-img .sb{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(38px) saturate(1.08);transform:scale(1.18);will-change:transform}
.stage-img .sf{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);height:82%;max-width:90%;aspect-ratio:4/5;background-size:cover;background-position:center;background-repeat:no-repeat;box-shadow:0 30px 70px rgba(0,0,0,.22)}
.stage-open{position:absolute;right:24px;bottom:24px;z-index:4;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper);mix-blend-mode:difference;border-bottom:1px solid;padding-bottom:2px;opacity:0;transition:opacity .4s var(--ease)}
.stage-col.has .stage-open{opacity:1}
.stage-cap{position:absolute;left:26px;bottom:24px;z-index:3;color:var(--paper);mix-blend-mode:difference;pointer-events:none}
.stage-cap .n{font-size:clamp(28px,4vw,54px);font-weight:600;letter-spacing:-.02em;line-height:.95}
.stage-cap .c{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.1em;opacity:.8;margin-top:8px}
.stage-idx{position:absolute;right:24px;top:22px;z-index:3;font-family:"Space Mono",monospace;font-size:12px;color:var(--paper);mix-blend-mode:difference}

/* GRID — bento, vertical scroll (looping) */
.grid-scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.grid-scroller::-webkit-scrollbar{display:none}
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:20vh;grid-auto-flow:dense;gap:2px;padding:2px}
.tile{position:relative;overflow:hidden;background:var(--stage);cursor:pointer;background-size:cover;background-position:center}
.tile.land{grid-column:span 2}
.tile.port{grid-row:span 2}
.tile.sq{grid-row:span 1}
.tile .veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(11,11,12,.72),transparent 55%);opacity:0;transition:opacity .45s var(--ease)}
.tile:hover .veil{opacity:1}
.tile .cap{position:absolute;left:16px;bottom:14px;color:var(--paper);z-index:2;opacity:0;transform:translateY(8px);transition:.5s var(--ease-out)}
.tile:hover .cap{opacity:1;transform:none}
.tile .cap .n{font-size:19px;font-weight:600;letter-spacing:-.01em}
.tile .cap .c{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.1em;opacity:.85;margin-top:3px}
.tile .tidx{position:absolute;left:14px;top:12px;z-index:2;font-family:"Space Mono",monospace;font-size:11px;color:var(--paper);mix-blend-mode:difference}
.grid-empty{position:absolute;inset:0;align-items:center;justify-content:center;font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grid-hint{position:absolute;right:16px;bottom:14px;z-index:5;display:none;font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);pointer-events:none}

/* DRAWER */
.backdrop{position:fixed;inset:0;z-index:90;background:rgba(11,11,12,.28);opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.backdrop.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:370px;max-width:88vw;z-index:95;background:var(--paper);border-left:1px solid var(--hair);transform:translateX(100%);transition:transform .45s var(--ease-out);display:flex;flex-direction:column}
.drawer.open{transform:none;box-shadow:-30px 0 80px rgba(0,0,0,.10)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--hair)}
.drawer-head .t{font-size:15px;font-weight:600}
.drawer-head button{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.drawer-head button:hover{color:var(--ink)}
.drawer-body{flex:1;overflow-y:auto;padding:6px 22px 22px;scrollbar-width:none}
.drawer-body::-webkit-scrollbar{display:none}
.fgroup{padding:22px 0;border-bottom:1px solid var(--hair)}
.fgroup:last-child{border-bottom:none}
.fgroup .glabel{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--hair);border-radius:100px;font-size:12.5px;color:var(--ink);transition:.25s var(--ease)}
.chip .cc{font-family:"Space Mono",monospace;font-size:9px;color:var(--muted)}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.on .cc{color:rgba(255,255,255,.55)}
.drawer-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;border-top:1px solid var(--hair)}
.drawer-foot .clr{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.drawer-foot .clr:hover{color:var(--ink)}
.drawer-foot .apply{background:var(--ink);color:var(--paper);padding:12px 18px;font-size:12.5px;border-radius:2px}

/* DETAIL — centered column + fixed right TOC */
.detail{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;scroll-behavior:smooth}
.detail::-webkit-scrollbar{display:none}
.d-top{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--hair)}
.d-back{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);transition:color .3s var(--ease)}
.d-back:hover{color:var(--ink)}
.d-count{font-family:"Space Mono",monospace;font-size:11px;color:var(--muted)}
.d-wrap{max-width:720px;margin:0 auto;padding:0 24px 12vh}
.d-section{padding:7vh 0;border-bottom:1px solid var(--hair)}
.d-section:last-child{border-bottom:none}
.d-section.cover{padding-top:6vh;border-bottom:none}
.d-k{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.d-title{font-size:clamp(40px,6vw,76px);font-weight:500;letter-spacing:-.03em;line-height:1;margin-top:14px}
.d-lead{margin-top:20px;font-size:clamp(15px,1.8vw,19px);line-height:1.5;color:#3a3a3a;max-width:52ch}
.d-cover-img{width:100%;margin-top:34px;aspect-ratio:4/3;background-size:cover;background-position:center;background-color:var(--stage);border-radius:2px}
.d-h{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
.d-section p{font-size:clamp(15px,1.7vw,18px);line-height:1.65;color:#2c2c2c;max-width:58ch}
.d-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 24px;margin-top:30px;padding-top:24px;border-top:1px solid var(--hair)}
.d-meta .l{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.d-meta .v{font-size:14px}
.d-gimg{display:block;width:100%;height:auto;margin:14px 0;border-radius:2px;background:var(--stage)}
.d-two{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.d-two p{font-size:14.5px;line-height:1.6;color:#3a3a3a;max-width:42ch}
.d-nextrow{display:flex;align-items:baseline;justify-content:space-between;cursor:pointer}
.d-nextrow .lbl{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.d-nextrow .nm{font-size:clamp(30px,4.5vw,56px);font-weight:500;letter-spacing:-.02em;color:var(--muted);transition:color .4s var(--ease),transform .4s var(--ease-out)}
.d-nextrow:hover .nm{color:var(--ink);transform:translateX(8px)}
.d-toc{position:fixed;right:30px;top:calc(50% + var(--head-h)/2);transform:translateY(-50%);z-index:25;padding-left:18px}
.d-toc .spine{position:absolute;left:0;top:6px;bottom:34px;width:1px;background:var(--hair)}
.d-toc .spine i{position:absolute;left:0;top:0;width:1px;background:var(--accent);height:0}
.d-toc .ti{display:flex;align-items:center;padding:9px 0;cursor:pointer;position:relative}
.d-toc .ti .dot{position:absolute;left:-18px;transform:translateX(-1.5px);width:5px;height:5px;border-radius:50%;border:1px solid var(--muted);background:var(--paper);transition:.3s var(--ease)}
.d-toc .ti.on .dot{background:var(--accent);border-color:var(--accent);transform:translateX(-1.5px) scale(1.4)}
.d-toc .ti .lb{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);transition:color .3s var(--ease);white-space:nowrap}
.d-toc .ti.on .lb{color:var(--ink)}
.d-toc .pct{margin-top:12px;font-family:"Space Mono",monospace;font-size:11px;color:var(--accent)}

/* ABOUT */
.about{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none}
.about::-webkit-scrollbar{display:none}
.about-in{max-width:1100px;padding:9vh 20px 12vh;margin:0 auto}
.about h1{font-size:clamp(38px,7vw,100px);font-weight:500;letter-spacing:-.03em;line-height:.98}
.about h1 span{color:var(--muted)}
.about h1 b{color:var(--accent);font-weight:500}
.about-lead{margin-top:44px;max-width:60ch;font-size:clamp(16px,2vw,22px);line-height:1.5;color:#3a3a3a}
.about-grid{margin-top:9vh;display:grid;grid-template-columns:220px 1fr;gap:40px 60px;border-top:1px solid var(--hair);padding-top:44px}
.about-grid + .about-grid{margin-top:44px}
.about-grid h3{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:400;padding-top:4px}
.svc{display:grid;gap:2px}
.svc-item{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--hair)}
.svc-item .t{font-size:clamp(20px,2.4vw,30px);font-weight:500;letter-spacing:-.01em}
.svc-item .d{font-size:12.5px;color:var(--muted);max-width:34ch;text-align:right}
.contact-row{display:flex;flex-wrap:wrap;gap:10px 40px;align-items:baseline}
.contact-row a{font-size:clamp(18px,2.4vw,30px);font-weight:500;letter-spacing:-.01em;border-bottom:1px solid transparent;transition:border-color .3s var(--ease),color .3s var(--ease)}
.contact-row a:hover{border-color:var(--accent);color:var(--accent)}

.tag{position:fixed;right:18px;bottom:14px;z-index:58;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);transition:color .3s var(--ease)}
.tag:hover{color:var(--ink)}

.rv{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease-out),transform .7s var(--ease-out)}
.rv.in{opacity:1;transform:none}

@media(max-width:860px){
  :root{--head-h:52px;--sub-h:42px}
  .nav{gap:18px}
  .rescount{display:none}
  .index-wrap{flex-direction:column}
  .list-col{width:100%;border-right:none}
  .stage-col{display:none}
  .row{grid-template-columns:44px 1fr;padding:18px 20px}
  .row .meta{grid-column:2;text-align:left;margin-top:6px}
  .row .cat{display:inline;margin-right:12px}
  .row .thumb{grid-column:1/-1;height:0;overflow:hidden;border-radius:2px;margin-top:0;background-size:cover;background-position:center;transition:height .5s var(--ease-out),margin .5s var(--ease-out)}
  .row.active .thumb{height:46vw;margin-top:16px}
  .about-grid{grid-template-columns:1fr;gap:20px}
  .svc-item .d{display:none}
  .bento{grid-template-columns:repeat(2,1fr);grid-auto-rows:26vh}
  .search{width:120px}
  .d-toc{display:none}.d-wrap{max-width:none}
  .d-meta{grid-template-columns:1fr 1fr}
  .d-two{grid-template-columns:1fr;gap:18px}
}
@media(max-width:1024px){.d-toc{display:none}.d-wrap{max-width:640px}}
@media(min-width:861px){.row .thumb{display:none}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}

/* CONTACT (get in touch stepper) */
.contact{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none}
.contact::-webkit-scrollbar{display:none}
.c-inner,.c-success{max-width:620px;margin:0 auto;padding:9vh 24px 12vh;min-height:100%;display:flex;flex-direction:column;justify-content:center}
.c-prog{display:flex;gap:8px;margin-bottom:38px}
.c-prog .cd{width:26px;height:3px;border-radius:2px;background:var(--hair);transition:background .3s var(--ease)}
.c-prog .cd.on{background:var(--accent)}
.c-step{display:none}
.c-step.on{display:block;animation:cfade .45s var(--ease-out)}
@keyframes cfade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.c-eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.c-h{font-size:clamp(30px,5vw,52px);font-weight:500;letter-spacing:-.03em;line-height:1.03;margin-bottom:34px}
.c-field{margin-bottom:24px}
.c-field label{display:block;font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.c-field label .opt{color:var(--muted);text-transform:none;letter-spacing:0;font-family:"Space Grotesk",sans-serif;font-size:11px}
.c-inp,.c-ta{width:100%;border:none;border-bottom:1px solid var(--hair);background:transparent;font-family:"Space Grotesk",sans-serif;font-size:20px;padding:8px 0;color:var(--ink);transition:border-color .25s var(--ease)}
.c-inp:focus,.c-ta:focus{outline:none;border-color:var(--ink)}
.c-inp::placeholder,.c-ta::placeholder{color:var(--muted)}
.c-ta{min-height:120px;resize:vertical;font-size:17px;line-height:1.5}
.c-chips{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:34px}
.c-chip{border:1px solid var(--hair);border-radius:100px;padding:10px 15px;font-size:13.5px;color:var(--ink);transition:.2s var(--ease);text-align:left}
.c-chip:hover{border-color:var(--muted)}
.c-chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.c-sub{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.c-budget{display:flex;flex-wrap:wrap;gap:9px}
.c-bud{border:1px solid var(--hair);border-radius:8px;padding:11px 16px;font-size:14px;transition:.2s var(--ease)}
.c-bud:hover{border-color:var(--muted)}
.c-bud.on{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.c-nav{display:flex;align-items:center;gap:12px;margin-top:44px}
.c-back{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.c-back:hover{color:var(--ink)}
.c-next,.c-submit{margin-left:auto;background:var(--ink);color:var(--paper);padding:13px 22px;border-radius:8px;font-size:14px;transition:opacity .2s var(--ease)}
.c-next:hover,.c-submit:hover{opacity:.88}
.c-err{color:#b4534b;font-size:13px;margin-top:16px;min-height:18px}
.c-lead{font-size:16px;line-height:1.55;color:#3a3a3a;margin-top:20px;max-width:44ch}
.cta2{margin-top:36px;align-self:flex-start;border:1px solid var(--ink);padding:12px 20px;border-radius:100px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;transition:.25s var(--ease)}
.cta2:hover{background:var(--ink);color:var(--paper)}

/* LIST view */
.list-view{position:absolute;inset:0;overflow:hidden}
.lv-scroller{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none}
.lv-scroller::-webkit-scrollbar{display:none}
.lv-set{padding:8px 0}
.lrow{display:grid;grid-template-columns:70px 1fr auto;align-items:baseline;gap:20px;padding:26px 40px;border-bottom:1px solid var(--hair);cursor:pointer;transition:opacity .3s var(--ease),padding .4s var(--ease-out)}
.lv-scroller:hover .lrow{opacity:.36}
.lrow:hover{opacity:1;padding-left:50px}
.lrow .lnum{font-size:12px;color:var(--muted)}
.lrow .lname{font-size:clamp(24px,4vw,46px);font-weight:500;letter-spacing:-.02em;line-height:1}
.lrow .lmeta{text-align:right;line-height:1.5}
.lrow .lcat{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block}
.lrow .lyr{font-size:11px;color:var(--muted)}
.lrow .lthumb{display:none}
.lv-peek{position:fixed;z-index:45;width:250px;height:172px;background-size:cover;background-position:center;border-radius:4px;box-shadow:0 22px 55px rgba(0,0,0,.30);opacity:0;transform:translate(-50%,-50%);transition:opacity .3s var(--ease),transform .25s var(--ease-out);pointer-events:none;will-change:left,top,transform}
.lv-peek.on{opacity:1}
@media(max-width:860px){
  .lrow{grid-template-columns:44px 1fr;gap:14px;padding:14px 20px;align-items:center}
  .lrow .lnum{display:none}
  .lrow .lmeta{display:none}
  .lrow .lname{font-size:20px}
  .lrow .lthumb{display:block;width:44px;height:44px;border-radius:5px;background-size:cover;background-position:center}
  .lv-scroller:hover .lrow{opacity:1}
}
</style>

<body>

<header class="head">
  <button class="brand" data-go="portfolio">miawmiaw <b>studio</b></button>
  <nav class="nav">
    <button data-go="portfolio" class="on">Work</button>
    <button data-go="about">About</button>
    <button class="cta" data-go="contact">Get in touch</button>
  </nav>
</header>

<div class="sub" id="sub">
  <div class="views">
    <button data-view="index" class="on">Index</button>
    <button data-view="grid">Grid</button>
    <button data-view="list">List</button>
  </div>
  <div class="subright">
    <input class="search" id="search" type="text" placeholder="Search projects" autocomplete="off">
    <span class="rescount mono" id="res-count">10 works</span>
    <button class="filterbtn" id="filter-open">Filter <span class="fbadge" id="fbadge" hidden>0</span></button>

</div>

<!-- PORTFOLIO -->

      <div class="stage-idx mono" id="stage-idx">01 / 10</div>

      <button class="stage-open" id="stage-open">Open project →</button>
    </div>
  </div>
  <div class="grid-scroller" id="view-grid" style="display:none"></div>
  <div class="list-view" id="view-list" style="display:none"><div class="lv-scroller" id="lv-scroller"></div></div>
  <div class="lv-peek" id="lv-peek"></div>
</section>

<!-- DETAIL -->
<section class="page" id="page-detail"><div class="detail" id="detail-inner"></div></section>

<!-- ABOUT -->

  <div class="about">
    <div class="about-in" id="about-in"></div></div></section>

<!-- CONTACT -->
<section class="page" id="page-contact">
  <div class="contact">
    <div class="c-inner" id="c-form">
      <div class="c-prog"><span class="cd on" data-s="1"></span><span class="cd" data-s="2"></span><span class="cd" data-s="3"></span></div>
      <div class="c-step on" data-step="1">
        <div class="c-eyebrow mono">01 — You</div>
        <h2 class="c-h">Let’s start with you.</h2>
        <div class="c-field"><label>Name *</label><input id="q-name" class="c-inp" type="text" placeholder="Your name" autocomplete="name"></div>
        <div class="c-field"><label>Email *</label><input id="q-email" class="c-inp" type="email" placeholder="you@email.com" autocomplete="email"></div>
        <div class="c-field"><label>Company <span class="opt">optional</span></label><input id="q-company" class="c-inp" type="text" placeholder="Company"></div>

      </div>
      <div class="c-step" data-step="3">
        <div class="c-eyebrow mono">03 — Brief</div>
        <h2 class="c-h">Tell us about it.</h2>
        <div class="c-field"><label>Project brief *</label><textarea id="q-brief" class="c-ta" placeholder="A few lines about your project, goals, and timeline…"></textarea></div>
        <div class="c-err" id="c-err3"></div>
      </div>
      <div class="c-nav">
        <button class="c-back" id="c-back">← Back</button>
        <button class="c-next" id="c-next">Next →</button>
        <button class="c-submit" id="c-submit" style="display:none">Send inquiry</button>

      <p class="c-lead">We’ve received your inquiry and will reply to your email as soon as we can.</p>

<!-- FILTER DRAWER -->
<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head"><span class="t">Filter</span><button id="filter-close">Close ×</button></div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot">
    <button class="clr" id="filter-clear">Clear all</button>
    <button class="apply" id="filter-apply"><span id="foot-count">10</span> works — View</button>
  </div>
</aside>

<button class="tag" data-go="contact">Contact</button>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SB_URL='https://unhrdsxnyaiyrnngqasp.supabase.co';
const SB_KEY='sb_publishable_0OpQDsYmbTlVBaDPPpofCA_-JrCRkNp';
const sb=createClient(SB_URL,SB_KEY);
/* ---- data loaded from Supabase at boot ---- */
let WORKS=[];

let FILTERS={device:[],industry:[],type:[]};
const GROUP_LABEL={device:"By device",industry:"By industry",type:"By category"};
const selected={device:new Set(),industry:new Set(),type:new Set()};
const pad=n=>String(n).padStart(2,'0');
const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
const isMobile=()=>window.matchMedia('(max-width:860px)').matches;

let activeWork=null;
let curView='index';
let searchQ='';

function match(w){
  if(!Object.keys(selected).every(g=>selected[g].size===0||selected[g].has(w[g])))return false;
  if(searchQ){const hay=(w.name+' '+w.type+' '+w.industry+' '+w.device+' '+(w.desc||'')).toLowerCase();if(!hay.includes(searchQ))return false;}
  return true;
}
function filtered(){return WORKS.filter(match);}
function activeCount(){return Object.values(selected).reduce((a,s)=>a+s.size,0);}

/* ---- stage images ---- */
const stageEl=document.getElementById('stage');
let stageImgs=[];
function buildStage(){
  stageEl.querySelectorAll('.stage-img').forEach(e=>e.remove());
  WORKS.forEach(w=>{const d=document.createElement('div');d.className='stage-img';d.dataset.n=w.n;
    d.innerHTML=`<div class="sb" style="background-image:url('${w.thumb}')"></div><div class="sf" style="background-image:url('${w.cover}')"></div>`;
    stageEl.insertBefore(d,stageEl.firstChild);});
  stageImgs=[...stageEl.querySelectorAll('.stage-img')];
}
const stageName=document.getElementById('stage-name');
const stageCat=document.getElementById('stage-cat');
const stageIdx=document.getElementById('stage-idx');
document.getElementById('stage-open').addEventListener('click',()=>openDetail(activeWork.n));
stageEl.addEventListener('click',e=>{if(e.target.id!=='stage-open')openDetail(activeWork.n);});
function setStage(w){
  activeWork=w;stageEl.classList.add('has');
  stageImgs.forEach(el=>el.classList.toggle('on',+el.dataset.n===w.n));
  stageName.textContent=w.name;stageCat.textContent=w.type+" — "+w.yr;
  const list=filtered();stageIdx.textContent=pad(Math.max(0,list.findIndex(x=>x.n===w.n))+1)+" / "+pad(list.length);
}

/* ---- vertical loop (index) ---- */
function makeLoop(scroller,buildSet){
  scroller.innerHTML='';
  const setA=buildSet();scroller.appendChild(setA);
  if(setA.offsetHeight<=scroller.clientHeight+2){scroller.onscroll=null;scroller.scrollTop=0;return;}
  const setB=buildSet();scroller.appendChild(setB);
  let setH=setA.offsetHeight;const measure=()=>{setH=setA.offsetHeight;};
  window.addEventListener('resize',measure);scroller.scrollTop=1;
  scroller.onscroll=()=>{if(setH<=0)return;if(scroller.scrollTop>=setH)scroller.scrollTop-=setH;else if(scroller.scrollTop<=0)scroller.scrollTop+=setH;onScrollActive();};
  requestAnimationFrame(measure);setTimeout(measure,400);
}
const listScroller=document.getElementById('list-scroller');
let _lmx=null,_lmy=null,mvx=0,mvy=0;
const listColEl=document.querySelector('.list-col');
if(listColEl)listColEl.addEventListener('mousemove',e=>{if(_lmx!=null){mvx=e.clientX-_lmx;mvy=e.clientY-_lmy;}_lmx=e.clientX;_lmy=e.clientY;});
function buildListSet(){
  const set=document.createElement('div');set.className='list-set';
  filtered().forEach(w=>{
    const r=document.createElement('div');r.className='row';r.dataset.n=w.n;
    r.innerHTML=`<div class="idx mono">${pad(w.n)}/</div>
      <div class="name">${w.name}</div>
      <div class="meta"><span class="cat">${w.type}</span><span class="yr">${w.yr}</span></div>
      <div class="desc">${w.desc}</div>
      <div class="thumb" style="background-image:url('${w.thumb}')"></div>`;
    r.addEventListener('mouseenter',()=>{if(isMobile())return;hovering=true;if(mvx>3&&mvx>Math.abs(mvy))return;activate(w.n);});
    r.addEventListener('click',()=>{if(isMobile()){if(activeWork&&activeWork.n===w.n){openDetail(w.n);}else{activate(w.n);}}else{openDetail(w.n);}});
    set.appendChild(r);
  });
  return set;
}
function renderList(){makeLoop(listScroller,buildListSet);const f=filtered();if(f.length)activate(f[0].n);}
let hovering=false;
listScroller.addEventListener('mouseleave',()=>{hovering=false;onScrollActive();});
function activate(n){const w=WORKS.find(x=>x.n===n);if(!w)return;document.querySelectorAll('.row').forEach(r=>r.classList.toggle('active',+r.dataset.n===n));setStage(w);}
function onScrollActive(){
  if(!activeWork||hovering||isMobile())return;
  const target=listScroller.getBoundingClientRect().top+listScroller.clientHeight*0.42;
  let best=null,bd=1e9;
  listScroller.querySelectorAll('.row').forEach(r=>{const b=r.getBoundingClientRect();const c=b.top+b.height/2;const dist=Math.abs(c-target);if(dist<bd){bd=dist;best=r;}});
  if(best){const n=+best.dataset.n;if(n!==activeWork.n)activate(n);}
  const p=(listScroller.scrollTop%400)/400;const cur=stageEl.querySelector('.stage-img.on .sb');
  if(cur&&!reduce)cur.style.transform=`scale(1.18) translateY(${(p-0.5)*-14}px)`;
}

/* ---- vertical bento (grid) ---- */
const bentoScroller=document.getElementById('view-grid');
function buildBentoSet(){
  const set=document.createElement('div');set.className='bento';
  filtered().forEach(w=>{
    const t=document.createElement('div');t.className='tile '+(w.shape||'sq');t.dataset.n=w.n;
    t.style.backgroundImage=`url('${w.thumb}')`;
    t.innerHTML=`<div class="tidx mono">${pad(w.n)}</div><div class="veil"></div><div class="cap"><div class="n">${w.name}</div><div class="c">${w.type} — ${w.yr}</div></div>`;
    t.addEventListener('click',()=>openDetail(w.n));
    set.appendChild(t);
  });
  return set;
}
function renderBento(){
  const fl=filtered();
  if(!fl.length){bentoScroller.innerHTML='<div class="grid-empty" style="display:flex">No works match</div>';return;}
  makeLoop(bentoScroller,buildBentoSet);
}

/* ---- LIST view (cursor peek, tilt) ---- */
const lvScroller=document.getElementById('lv-scroller');
const lvPeek=document.getElementById('lv-peek');
function buildListViewSet(){
  const set=document.createElement('div');set.className='lv-set';
  filtered().forEach(w=>{
    const r=document.createElement('div');r.className='lrow';r.dataset.n=w.n;
    r.innerHTML=`<div class="lthumb" style="background-image:url('${w.thumb}')"></div><div class="lnum mono">${pad(w.n)}</div><div class="lname">${w.name}</div><div class="lmeta"><span class="lcat">${w.type}</span><span class="lyr mono">${w.yr}</span></div>`;
    r.addEventListener('mouseenter',()=>{if(isMobile())return;lvPeek.style.backgroundImage=`url('${w.thumb}')`;lvPeek.classList.add('on');});
    r.addEventListener('click',()=>openDetail(w.n));
    set.appendChild(r);
  });
  return set;
}
function renderListView(){
  const fl=filtered();
  if(!fl.length){lvScroller.innerHTML='<div class="grid-empty" style="display:flex">No works match</div>';return;}
  makeLoop(lvScroller,buildListViewSet);
}
let _llx=null,_lvx=0;
lvScroller.addEventListener('mousemove',e=>{if(isMobile())return;if(_llx!=null)_lvx=e.clientX-_llx;_llx=e.clientX;lvPeek.style.left=e.clientX+'px';lvPeek.style.top=e.clientY+'px';const rot=Math.max(-12,Math.min(12,_lvx*0.6));lvPeek.style.transform=`translate(-50%,-50%) rotate(${rot}deg)`;});
lvScroller.addEventListener('mouseleave',()=>lvPeek.classList.remove('on'));

/* ---- DETAIL ---- */
const detailInner=document.getElementById('detail-inner');
function nextWork(n){const i=WORKS.findIndex(w=>w.n===n);return WORKS[(i+1)%WORKS.length];}
let dSecs=[];
function buildDetail(w){
  const nx=nextWork(w.n);
  const hasG=(w.images&&w.images.length>0);
  dSecs=[["cover","Cover"],["overview","Overview"],["approach","Approach"]];
  if(hasG)dSecs.push(["gallery","Gallery"]);
  dSecs.push(["next","Next"]);
  const galleryImgs=hasG?w.images.map(src=>`<img class="d-gimg" src="${src}" alt="${w.name}" loading="lazy" decoding="async">`).join(''):'';
  const toc=`<div class="d-toc" id="d-toc"><div class="spine"><i id="d-fill"></i></div>
    ${dSecs.map((sn,i)=>`<div class="ti" data-target="s-${sn[0]}"><span class="dot"></span><span class="lb">${pad(i+1)} ${sn[1]}</span></div>`).join('')}
    <div class="pct mono" id="d-pct">0%</div></div>`;
  const coverSec=`<section class="d-section cover" id="s-cover">
      <span class="d-k">${w.type} — ${w.yr}</span>
      <h1 class="d-title">${w.name}</h1>
      <p class="d-lead">${w.desc}</p>
      <div class="d-cover-img" style="background-image:url('${w.cover}')"></div>
    </section>`;
  const overviewSec=`<section class="d-section" id="s-overview">
      <div class="d-h">Overview</div><p>${w.overview}</p>
      <div class="d-meta">
        <div class="m"><span class="l">Client</span><span class="v">${w.client}</span></div>
        <div class="m"><span class="l">Role</span><span class="v">${w.role}</span></div>
        <div class="m"><span class="l">Device</span><span class="v">${w.device}</span></div>
        <div class="m"><span class="l">Industry</span><span class="v">${w.industry}</span></div>
        <div class="m"><span class="l">Category</span><span class="v">${w.type}</span></div>
        <div class="m"><span class="l">Year</span><span class="v">${w.yr}</span></div>
      </div>
    </section>`;
  const approachSec=`<section class="d-section" id="s-approach">
      <div class="d-h">Approach</div>
      <div class="d-two"><p>${w.approach}</p><p>Every deliverable ships as a single-file, developer-ready handoff — no ambiguity between design and build. The system is documented so it holds up as the work scales beyond this first release.</p></div>
    </section>`;
  const gallerySec=hasG?`<section class="d-section" id="s-gallery"><div class="d-h">Gallery</div>${galleryImgs}</section>`:'';
  const nextSec=`<section class="d-section" id="s-next"><div class="d-h">Next</div>
      <div class="d-nextrow" id="d-next"><span class="lbl">Project ${pad(nx.n)}</span><span class="nm">${nx.name} →</span></div>
    </section>`;
  detailInner.innerHTML=`
    <div class="d-top"><button class="d-back" id="d-back">← Back</button><span class="d-count mono">${pad(w.n)} / ${pad(WORKS.length)}</span></div>
    ${toc}
    <div class="d-wrap">${coverSec}${overviewSec}${approachSec}${gallerySec}${nextSec}</div>`;
  document.getElementById('d-back').onclick=()=>go('portfolio');
  document.getElementById('d-next').onclick=()=>openDetail(nx.n);
  const sc=document.querySelector('.detail');
  document.querySelectorAll('#d-toc .ti').forEach(ti=>ti.onclick=()=>{const el=document.getElementById(ti.dataset.target);sc.scrollTo({top:el.offsetTop-64,behavior:'smooth'});});
}
function setupDetailScroll(){
  const sc=document.querySelector('.detail');const fill=document.getElementById('d-fill');const pct=document.getElementById('d-pct');
  const items=[...document.querySelectorAll('#d-toc .ti')];const secs=dSecs.map(s=>document.getElementById('s-'+s[0]));
  function upd(){
    const max=sc.scrollHeight-sc.clientHeight;const p=max>0?sc.scrollTop/max:0;
    if(fill)fill.style.height=(p*100)+'%';if(pct)pct.textContent=Math.round(p*100)+'%';
    const line=sc.scrollTop+sc.clientHeight*0.32;let ai=0;secs.forEach((el,i)=>{if(el&&el.offsetTop<=line)ai=i;});
    items.forEach((it,i)=>it.classList.toggle('on',i===ai));
  }
  sc.onscroll=upd;upd();
}
function openDetail(n){const w=WORKS.find(x=>x.n===n);if(!w)return;buildDetail(w);document.querySelector('.detail').scrollTop=0;go('detail');requestAnimationFrame(setupDetailScroll);}

/* ---- FILTER DRAWER ---- */
const drawer=document.getElementById('drawer');const backdrop=document.getElementById('backdrop');
const drawerBody=document.getElementById('drawer-body');
function optCount(g,v){return WORKS.filter(w=>w[g]===v).length;}
function buildDrawer(){
  drawerBody.innerHTML=Object.keys(FILTERS).map(g=>`
    <div class="fgroup">
      <div class="glabel">${GROUP_LABEL[g]}</div>
      <div class="chips">${FILTERS[g].map(v=>`<button class="chip ${selected[g].has(v)?'on':''}" data-g="${g}" data-v="${v}">${v}<span class="cc">${pad(optCount(g,v))}</span></button>`).join('')}</div>
    </div>`).join('');
  drawerBody.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const g=c.dataset.g,v=c.dataset.v;
    if(selected[g].has(v))selected[g].delete(v);else selected[g].add(v);
    c.classList.toggle('on');applyFilters();
  });
}
function applyFilters(){
  renderList();
  if(curView==='grid')renderBento();else if(curView==='list')renderListView();
  const f=filtered().length,a=activeCount();
  document.getElementById('res-count').textContent=f+" works";
  document.getElementById('foot-count').textContent=f;
  const badge=document.getElementById('fbadge');
  if(a){badge.hidden=false;badge.textContent=a;}else badge.hidden=true;
}
function openDrawer(){buildDrawer();drawer.classList.add('open');backdrop.classList.add('on');drawer.setAttribute('aria-hidden','false');}
function closeDrawer(){drawer.classList.remove('open');backdrop.classList.remove('on');drawer.setAttribute('aria-hidden','true');}
document.getElementById('filter-open').onclick=openDrawer;
document.getElementById('filter-close').onclick=closeDrawer;
document.getElementById('filter-apply').onclick=closeDrawer;
backdrop.onclick=closeDrawer;
document.getElementById('filter-clear').onclick=()=>{Object.values(selected).forEach(s=>s.clear());buildDrawer();applyFilters();};
const searchEl=document.getElementById('search');if(searchEl)searchEl.addEventListener('input',()=>{searchQ=searchEl.value.trim().toLowerCase();applyFilters();});

/* ---- view toggle ---- */
const VIEW_EL={index:document.getElementById('view-index'),grid:document.getElementById('view-grid'),list:document.getElementById('view-list')};
function applyView(){
  Object.entries(VIEW_EL).forEach(([k,el])=>{el.style.display=(k===curView)?(k==='index'?'flex':'block'):'none';});
  if(curView!=='list')lvPeek.classList.remove('on');
  if(curView==='index')renderList();
  else if(curView==='grid')renderBento();
  else if(curView==='list')renderListView();
}
document.querySelectorAll('.views button').forEach(b=>{
  b.onclick=()=>{const v=b.dataset.view;if(v===curView)return;curView=v;
    document.querySelectorAll('.views button').forEach(x=>x.classList.toggle('on',x===b));
    applyView();
  };
});

/* ---- router ---- */
/* ---- contact stepper ---- */
const SERVICES_LIST=["Landing Page UI/UX Design HTML","Website Design","SaaS Dashboard / CRM / ERP","Mobile App Design","UX Audit","Clean Up Vibe-Coded Apps","Custom UI/UX Design"];
const BUDGETS=["Under $500","$500–2k","$2k–5k","$5k+"];
const cState={step:1,services:new Set(),budget:''};
function renderContactOptions(){
  const sv=document.getElementById('q-services'),bd=document.getElementById('q-budget');
  if(!sv||!bd)return;
  sv.innerHTML=SERVICES_LIST.map(x=>`<button type="button" class="c-chip" data-v="${x}">${x}</button>`).join('');
  bd.innerHTML=BUDGETS.map(x=>`<button type="button" class="c-bud" data-v="${x}">${x}</button>`).join('');
  sv.querySelectorAll('.c-chip').forEach(c=>c.onclick=()=>{const v=c.dataset.v;if(cState.services.has(v))cState.services.delete(v);else cState.services.add(v);c.classList.toggle('on');});
  bd.querySelectorAll('.c-bud').forEach(c=>c.onclick=()=>{cState.budget=c.dataset.v;bd.querySelectorAll('.c-bud').forEach(x=>x.classList.toggle('on',x===c));});
}
function cShowStep(n){
  cState.step=n;
  document.querySelectorAll('#c-form .c-step').forEach(st=>st.classList.toggle('on',+st.dataset.step===n));
  document.querySelectorAll('.c-prog .cd').forEach(d=>d.classList.toggle('on',+d.dataset.s<=n));
  document.getElementById('c-back').style.visibility=n>1?'visible':'hidden';
  document.getElementById('c-next').style.display=n<3?'inline-flex':'none';
  document.getElementById('c-submit').style.display=n===3?'inline-flex':'none';
}
function cValid1(){const nm=document.getElementById('q-name').value.trim();const em=document.getElementById('q-email').value.trim();const ok=!!nm&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em);document.getElementById('c-err1').textContent=ok?'':'Please enter your name and a valid email.';return ok;}
function cValid3(){const b=document.getElementById('q-brief').value.trim();const ok=b.length>=10;document.getElementById('c-err3').textContent=ok?'':'Please add a short brief (at least a sentence).';return ok;}
function resetContact(){cState.step=1;cState.services.clear();cState.budget='';const fm=document.getElementById('c-form'),su=document.getElementById('c-success');if(fm)fm.style.display='flex';if(su)su.style.display='none';['q-name','q-email','q-company','q-brief'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});document.querySelectorAll('#q-services .c-chip,#q-budget .c-bud').forEach(x=>x.classList.remove('on'));cShowStep(1);}
document.getElementById('c-next').onclick=()=>{if(cState.step===1&&!cValid1())return;cShowStep(Math.min(3,cState.step+1));};
document.getElementById('c-back').onclick=()=>cShowStep(Math.max(1,cState.step-1));
document.getElementById('c-submit').onclick=async()=>{
  if(!cValid3())return;
  const btn=document.getElementById('c-submit');btn.textContent='Sending…';btn.disabled=true;
  const payload={name:document.getElementById('q-name').value.trim(),email:document.getElementById('q-email').value.trim(),company:document.getElementById('q-company').value.trim(),services:[...cState.services],budget:cState.budget,brief:document.getElementById('q-brief').value.trim()};
  const {error}=await sb.from('inquiries').insert(payload);
  btn.textContent='Send inquiry';btn.disabled=false;
  if(error){document.getElementById('c-err3').textContent='Something went wrong — please try again.';console.error(error);return;}
  document.getElementById('c-form').style.display='none';document.getElementById('c-success').style.display='flex';
};

/* ---- router ---- */
const pP=document.getElementById('page-portfolio'),pA=document.getElementById('page-about'),pD=document.getElementById('page-detail'),pC=document.getElementById('page-contact');
const sub=document.getElementById('sub'),tag=document.querySelector('.tag');
function go(page){
  pP.classList.toggle('show',page==='portfolio');
  pA.classList.toggle('show',page==='about');
  pD.classList.toggle('show',page==='detail');
  pC.classList.toggle('show',page==='contact');
  const showSub=page==='portfolio';
  sub.style.opacity=showSub?'1':'0';sub.style.transform=showSub?'none':'translateY(-6px)';sub.style.pointerEvents=showSub?'auto':'none';
  tag.style.opacity=(page==='detail'||page==='contact')?'0':'1';
  document.querySelectorAll('.nav button,.nav .cta').forEach(b=>b.classList.toggle('on',b.dataset.go===page||(page==='detail'&&b.dataset.go==='portfolio')));
  if(page==='about')document.querySelectorAll('#page-about .rv').forEach((el,i)=>setTimeout(()=>el.classList.add('in'),80+i*90));
  if(page==='contact')resetContact();
}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));

/* ---- about from data ---- */
function renderAboutData(ab){
  const el=document.getElementById('about-in');if(!el)return;
  el.innerHTML=`<h1 class="rv">${ab.headline||''}</h1>
    <p class="about-lead rv">${ab.lead||''}</p>
    <div class="about-grid rv"><h3>Practice</h3><div class="svc">${(ab.practice||[]).map(r=>`<div class="svc-item"><span class="t">${r[0]}</span><span class="d">${r[1]}</span></div>`).join('')}</div></div>
    <div class="about-grid rv"><h3>Contact</h3><div class="contact-row">${(ab.contacts||[]).map(r=>`<a href="${String(r[1]).includes('@')?'mailto:'+r[1]:r[1]}">${r[0]}</a>`).join('')}</div></div>`;
}

/* ---- init after data ---- */
function init(){
  buildStage();applyFilters();renderContactOptions();
  setTimeout(()=>{document.querySelectorAll('#list-scroller .row').forEach((r,i)=>{if(i>7)return;r.style.opacity='0';r.style.transform='translateY(12px)';r.style.transition='opacity .6s var(--ease-out),transform .6s var(--ease-out)';setTimeout(()=>{r.style.opacity='';r.style.transform='';},60+i*55);});},60);
}

/* ---- boot: load from Supabase ---- */
(async function boot(){
  try{
    const [pr,fo,ab]=await Promise.all([
      sb.from('projects').select('*').eq('status','Published').order('position'),
      sb.from('filter_options').select('*').order('position'),
      sb.from('site_about').select('*').eq('id',1).single()
    ]);
    const projs=pr.data||[];
    WORKS=projs.map((p,i)=>({n:i+1,name:p.name,device:p.device,industry:p.industry,type:p.type,shape:(p.device==='Mobile'?'port':p.device==='Desktop'?'land':'sq'),yr:p.year,client:p.client,role:p.role,desc:p.caption,overview:p.overview,approach:p.approach,cover:p.cover,thumb:(p.cover_thumb||p.cover),images:(p.images||[])}));
    FILTERS={device:[],industry:[],type:[]};(fo.data||[]).forEach(o=>{if(FILTERS[o.grp])FILTERS[o.grp].push(o.value);});
    if(ab.data)renderAboutData(ab.data);
    init();
  }catch(err){
    console.error('load failed',err);
    document.getElementById('list-scroller').innerHTML='<div style="padding:40px 34px;color:var(--muted);font-family:Space Mono,monospace;font-size:12px">Failed to load content.</div>';
  }
})();
</script>
